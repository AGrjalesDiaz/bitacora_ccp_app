<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bitácora CCP</title>
  <style>
    :root {
      --bg: #f4f6f5;
      --surface: #ffffff;
      --surface-2: #eef1f0;
      --border: #d7ddda;
      --text: #1c2620;
      --text-dim: #5b6b62;
      --accent: #2f6f4f;
      --accent-dim: #e4efe8;
      --accent-ink: #ffffff;
      --warn: #a15b00;
      --warn-bg: #fdecd2;
      --bad: #b3261e;
      --bad-bg: #fbe4e2;
      --ok: #2f6f4f;
      --ok-bg: #e4efe8;
      --pend: #6b6b6b;
      --pend-bg: #e9e9e7;
      --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #121712;
        --surface: #1a211b;
        --surface-2: #212a22;
        --border: #334033;
        --text: #e7ede8;
        --text-dim: #9db09f;
        --accent: #5fb98a;
        --accent-dim: #203528;
        --accent-ink: #0b140d;
        --warn: #e8b673;
        --warn-bg: #3a2c12;
        --bad: #e58b83;
        --bad-bg: #3a1f1c;
        --ok: #5fb98a;
        --ok-bg: #1c3123;
        --pend: #9aa39c;
        --pend-bg: #242c25;
      }
    }

    :root[data-theme="dark"] {
      --bg: #121712;
      --surface: #1a211b;
      --surface-2: #212a22;
      --border: #334033;
      --text: #e7ede8;
      --text-dim: #9db09f;
      --accent: #5fb98a;
      --accent-dim: #203528;
      --accent-ink: #0b140d;
      --warn: #e8b673;
      --warn-bg: #3a2c12;
      --bad: #e58b83;
      --bad-bg: #3a1f1c;
      --ok: #5fb98a;
      --ok-bg: #1c3123;
      --pend: #9aa39c;
      --pend-bg: #242c25;
    }

    * {
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", -apple-system, Segoe UI, Roboto, sans-serif;
      line-height: 1.4;
      margin: 0;
      padding: 0;
    }

    h1, h2, h3 {
      font-family: "IBM Plex Sans", "Inter", sans-serif;
      text-wrap: balance;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    input, select, textarea {
      font-family: inherit;
    }

    .app {
      max-width: 1000px;
      margin: 0 auto;
      padding: 16px 16px 60px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand .mark {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: var(--accent);
      color: var(--accent-ink);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-family: var(--mono);
      font-size: 13px;
      flex: none;
    }

    .brand h1 {
      font-size: 17px;
      margin: 0;
    }

    .brand .sub {
      font-size: 11.5px;
      color: var(--text-dim);
      margin-top: 1px;
    }

    .tecnico-field {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-dim);
    }

    .tecnico-field input {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 12.5px;
      width: 130px;
    }

    .tabs {
      display: flex;
      gap: 4px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
      overflow-x: auto;
    }

    .tab {
      padding: 9px 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-dim);
      border: none;
      background: none;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
    }

    .tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: flex-end;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 150px;
      flex: 1;
    }

    .field label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    select, input[type=text], input[type=number], textarea {
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      border-radius: 7px;
      padding: 8px 10px;
      font-size: 13.5px;
      width: 100%;
    }

    textarea {
      resize: vertical;
      min-height: 54px;
    }

    .btn {
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      border-radius: 7px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
    }

    .btn:hover {
      filter: brightness(0.97);
    }

    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
    }

    .btn.small {
      padding: 5px 10px;
      font-size: 12px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 99px;
      letter-spacing: 0.02em;
    }

    .badge.ok {
      background: var(--ok-bg);
      color: var(--ok);
    }

    .badge.bad {
      background: var(--bad-bg);
      color: var(--bad);
    }

    .badge.warn {
      background: var(--warn-bg);
      color: var(--warn);
    }

    .badge.pend {
      background: var(--pend-bg);
      color: var(--pend);
    }

    .grupo-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-dim);
      margin: 18px 0 8px;
      padding-bottom: 4px;
      border-bottom: 1px dashed var(--border);
    }

    .elemento {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 4px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .elemento:last-child {
      border-bottom: none;
    }

    .elemento .id {
      font-family: var(--mono);
      font-weight: 700;
      font-size: 12.5px;
      background: var(--surface-2);
      padding: 2px 7px;
      border-radius: 5px;
      min-width: 44px;
      text-align: center;
    }

    .elemento .desc {
      flex: 1;
      font-size: 13px;
      min-width: 120px;
    }

    .elemento .desc .sec {
      color: var(--text-dim);
      font-size: 11.5px;
    }

    .elemento .btns {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .panel {
      margin-top: 8px;
      padding: 12px;
      background: var(--accent-dim);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .panel .rule-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 8px 10px;
      font-size: 12.5px;
      margin: 8px 0;
    }

    .rule-box b {
      color: var(--accent);
    }

    .note {
      font-size: 11px;
      color: var(--text-dim);
      font-style: italic;
      margin-top: 4px;
    }

    .alert {
      background: var(--warn-bg);
      color: var(--warn);
      border-radius: 7px;
      padding: 8px 10px;
      font-size: 12.5px;
      font-weight: 600;
      margin-top: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
    }

    th, td {
      text-align: left;
      padding: 7px 8px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }

    th {
      color: var(--text-dim);
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      position: sticky;
      top: 0;
      background: var(--surface);
    }

    .tablewrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .thumbs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .thumbs img {
      width: 56px;
      height: 56px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .thumb-wrap {
      position: relative;
      width: 56px;
      height: 56px;
    }

    .thumb-wrap img {
      width: 56px;
      height: 56px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--border);
      display: block;
    }

    .thumb-del {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bad-bg);
      color: var(--bad);
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      cursor: pointer;
    }

    .thumb-pend-badge {
      position: absolute;
      bottom: 2px;
      left: 2px;
      right: 2px;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-size: 8.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      text-align: center;
      border-radius: 3px;
      padding: 1px 0;
    }

    .empty {
      color: var(--text-dim);
      font-size: 13px;
      padding: 20px;
      text-align: center;
    }

    .statline {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 10px 14px;
      flex: 1;
      min-width: 110px;
    }

    .stat .n {
      font-family: var(--mono);
      font-size: 20px;
      font-weight: 700;
      color: var(--accent);
    }

    .stat .l {
      font-size: 10.5px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .toast {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--text);
      color: var(--bg);
      padding: 9px 18px;
      border-radius: 99px;
      font-size: 12.5px;
      font-weight: 600;
      z-index: 50;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.25);
    }

    .footer-note {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 24px;
      text-align: center;
    }

    .origen-badge {
      font-size: 10.5px;
      background: var(--pend-bg);
      color: var(--pend);
      padding: 2px 7px;
      border-radius: 6px;
      margin-left: 6px;
    }

    .file-input-wrapper {
      position: relative;
      display: inline-block;
    }

    input[type="file"] {
      display: none;
    }

    .file-label {
      display: inline-block;
      padding: 8px 14px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 7px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }

    .file-label:hover {
      filter: brightness(0.97);
    }

    .config-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .config-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .config-item:last-child {
      margin-bottom: 0;
    }

    .config-item label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dim);
      min-width: 150px;
    }

    .config-item input {
      padding: 6px 8px;
      font-size: 12px;
      flex: 0 0 100px;
    }
  </style>
</head>
<body>
  <div class="app" id="app"></div>

  <script src="app.js"></script>
</body>
</html>
