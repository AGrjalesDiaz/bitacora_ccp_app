<title>Bitácora CCP</title>
<style>
:root{
  --bg:#f4f6f5; --surface:#ffffff; --surface-2:#eef1f0; --border:#d7ddda;
  --text:#1c2620; --text-dim:#5b6b62; --accent:#2f6f4f; --accent-dim:#e4efe8;
  --accent-ink:#ffffff; --warn:#a15b00; --warn-bg:#fdecd2; --bad:#b3261e; --bad-bg:#fbe4e2;
  --ok:#2f6f4f; --ok-bg:#e4efe8; --pend:#6b6b6b; --pend-bg:#e9e9e7;
  --mono: "IBM Plex Mono","SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121712; --surface:#1a211b; --surface-2:#212a22; --border:#334033;
    --text:#e7ede8; --text-dim:#9db09f; --accent:#5fb98a; --accent-dim:#203528;
    --accent-ink:#0b140d; --warn:#e8b673; --warn-bg:#3a2c12; --bad:#e58b83; --bad-bg:#3a1f1c;
    --ok:#5fb98a; --ok-bg:#1c3123; --pend:#9aa39c; --pend-bg:#242c25;
  }
}
:root[data-theme="dark"]{
  --bg:#121712; --surface:#1a211b; --surface-2:#212a22; --border:#334033;
  --text:#e7ede8; --text-dim:#9db09f; --accent:#5fb98a; --accent-dim:#203528;
  --accent-ink:#0b140d; --warn:#e8b673; --warn-bg:#3a2c12; --bad:#e58b83; --bad-bg:#3a1f1c;
  --ok:#5fb98a; --ok-bg:#1c3123; --pend:#9aa39c; --pend-bg:#242c25;
}
*{box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:"Inter",-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.4;}
h1,h2,h3{font-family:"IBM Plex Sans","Inter",sans-serif;text-wrap:balance;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
.app{max-width:1000px;margin:0 auto;padding:16px 16px 60px;}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand .mark{width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-family:var(--mono);font-size:13px;flex:none;}
.brand h1{font-size:17px;margin:0;}
.brand .sub{font-size:11.5px;color:var(--text-dim);margin-top:1px;}
.tecnico-field{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-dim);}
.tecnico-field input{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:6px;padding:5px 8px;font-size:12.5px;width:130px;}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto;}
.tab{padding:9px 14px;font-size:13px;font-weight:600;color:var(--text-dim);border:none;background:none;border-bottom:2px solid transparent;white-space:nowrap;}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
.field{display:flex;flex-direction:column;gap:4px;min-width:150px;flex:1;}
.field label{font-size:11px;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:.03em;}
select,input[type=text],input[type=number],textarea{border:1px solid var(--border);background:var(--surface-2);color:var(--text);border-radius:7px;padding:8px 10px;font-size:13.5px;width:100%;}
textarea{resize:vertical;min-height:54px;}
.btn{border:1px solid var(--border);background:var(--surface-2);color:var(--text);border-radius:7px;padding:8px 14px;font-size:13px;font-weight:600;}
.btn:hover{filter:brightness(0.97);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
.btn.small{padding:5px 10px;font-size:12px;}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;letter-spacing:.02em;}
.badge.ok{background:var(--ok-bg);color:var(--ok);}
.badge.bad{background:var(--bad-bg);color:var(--bad);}
.badge.warn{background:var(--warn-bg);color:var(--warn);}
.badge.pend{background:var(--pend-bg);color:var(--pend);}
.grupo-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text-dim);margin:18px 0 8px;padding-bottom:4px;border-bottom:1px dashed var(--border);}
.elemento{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 4px;border-bottom:1px solid var(--border);}
.elemento:last-child{border-bottom:none;}
.elemento .id{font-family:var(--mono);font-weight:700;font-size:12.5px;background:var(--surface-2);padding:2px 7px;border-radius:5px;min-width:44px;text-align:center;}
.elemento .desc{flex:1;font-size:13px;}
.elemento .desc .sec{color:var(--text-dim);font-size:11.5px;}
.panel{margin-top:8px;padding:12px;background:var(--accent-dim);border:1px solid var(--border);border-radius:8px;}
.panel .rule-box{background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:8px 10px;font-size:12.5px;margin:8px 0;}
.rule-box b{color:var(--accent);}
.note{font-size:11px;color:var(--text-dim);font-style:italic;margin-top:4px;}
.alert{background:var(--warn-bg);color:var(--warn);border-radius:7px;padding:8px 10px;font-size:12.5px;font-weight:600;margin-top:8px;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:top;}
th{color:var(--text-dim);font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;position:sticky;top:0;background:var(--surface);}
.tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:8px;}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
.thumbs img{width:56px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--border);}
.empty{color:var(--text-dim);font-size:13px;padding:20px;text-align:center;}
.statline{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:10px;}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:10px 14px;flex:1;min-width:110px;}
.stat .n{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--accent);}
.stat .l{font-size:10.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.03em;}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 18px;border-radius:99px;font-size:12.5px;font-weight:600;z-index:50;box-shadow:0 4px 18px rgba(0,0,0,.25);}
.footer-note{font-size:11px;color:var(--text-dim);margin-top:24px;text-align:center;}
select[multiple]{min-height:70px;}
.origen-badge{font-size:10.5px;background:var(--pend-bg);color:var(--pend);padding:2px 7px;border-radius:6px;margin-left:6px;}
</style>

<div class="app" id="app"></div>

<script>
const CATALOGO = __CATALOGO_JSON__;

const CAPITULOS_BORRADOR_NOTE = "Numeración de capítulo en borrador — ajustar cuando exista la estructura oficial de ítems del presupuesto.";

const MURO_REGLAS = {
  bien: { label: "Bien (sin patología)", intervencion: "", capitulo: "", unidad: "", tipo_cantidad: "", cascada: null },
  panete: {
    label: "Muro sano — pañete no garantizable (antiguo/deteriorado)",
    intervencion: "Picar pañete existente, dejar bloque a la vista; repañetar + estucar + pintar de nuevo",
    capitulo: "1.2 Acabados — Repañete, estuco y pintura de muro",
    unidad: "m²", tipo_cantidad: "Total", cascada: null
  },
  fisura_mayor: {
    label: "Fisura mayor al umbral definido",
    intervencion: "Grapado en U + retiro total del pañete existente + repañetar + estucar + pintar",
    capitulo: "1.1 Mampostería — Grapado en U de fisura  +  1.2 Acabados — Repañete, estuco y pintura de muro",
    unidad: "ml (grapado) / m² (acabado)", tipo_cantidad: "Parcial (grapado) + Total (acabado)", cascada: null
  },
  grieta_grave: {
    label: "Grieta grave / muro desplazado o desplomado",
    intervencion: "Demolición del muro + reposición con sistema liviano (Superboard)",
    capitulo: "1.3 Demolición y reposición de muro liviano (Superboard)",
    unidad: "m²", tipo_cantidad: "Total", cascada: "piso"
  }
};
const UMBRAL_FISURA_MM = 5; // ajustable — criterio del ingeniero a cargo

const PISO_MATERIALES = ["Mármol","Porcelanato","Cerámica","Laminado SPC","Otro"];
const ENCHAPE_MATERIALES = ["Mármol","Granito","Acero inoxidable","Cerámica","Otro"];
const CIELO_RASO_TIPO = { "15": "Pañete + Estuco + Pintura (sobre torta inferior de placa)", "16": "Drywall" };
const CIELO_RASO_INTERVENCION = {
  "15": "Picar pañete afectado y rehacer pañete + estuco + pintura desde cero",
  "16": "Retiro y reposición de paneles de drywall afectados (nota: regla asumida, validar con criterio del ingeniero — ver mensaje del proyecto)"
};

const OFICINAS_ORDEN = ["OF501","OF502","OF503","OF504","OF505","OF506","NUCLEO COMUN (ascensores/escalera)","PUNTO FIJO"];
function ofLabel(o){
  if(o==="NUCLEO COMUN (ascensores/escalera)") return "Núcleo común (ascensores/escalera)";
  if(o==="PUNTO FIJO") return "Punto fijo (pendiente de levantamiento)";
  return o;
}

let db=null, downloads=null;
let hallazgos=[]; // live cache from db
let unsub=null;
let state={ tab:"captura", piso:"15", oficina:"OF501", tecnico:"", openEl:null };

try{ state.tecnico = localStorage.getItem("ccp_tecnico")||""; }catch(e){}

function uid(){ return "h_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8); }
function codigoEspacio(){ return "P"+state.piso+"-"+state.oficina; }
function fmt(n){ return (Math.round(n*100)/100).toString(); }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function elementosDe(oficina){
  return CATALOGO.filter(e=> e.oficina===oficina || e.secundaria===oficina);
}
function hallazgoDe(elId){
  return hallazgos.find(h=>h.codigo_elemento===elId && h.codigo_espacio===codigoEspacio());
}

async function initDb(){
  db = await claude.use("db");
  downloads = await claude.use("downloads");
  if(!db){ render(); toast("Base de datos no disponible en esta vista — revisa conexión."); return; }
  unsub = db.collection("hallazgos").onSnapshot(snap=>{
    hallazgos = snap.docs.map(d=>({ ...d.data(), _id:d.id }));
    render();
  }, err=>{ console.error(err); toast("Error de sincronización: "+err.code); });
}

async function guardarHallazgo(doc, id){
  if(!db){ toast("Sin base de datos — no se pudo guardar."); return false; }
  try{
    await db.collection("hallazgos").doc(id).set(doc);
    return true;
  }catch(e){
    if(e && e.code==="invalid_argument"){ toast("El registro quedó muy pesado (fotos). Quita una foto e intenta de nuevo."); }
    else toast("No se pudo guardar: "+(e&&e.code||"error"));
    return false;
  }
}

function toast(msg){
  let t=document.createElement("div"); t.className="toast"; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2600);
}

function resizeImage(file, maxW){
  return new Promise((resolve)=>{
    const img=new Image(); const reader=new FileReader();
    reader.onload=e=>{ img.onload=()=>{
      const scale=Math.min(1, maxW/img.width);
      const w=Math.round(img.width*scale), h=Math.round(img.height*scale);
      const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
      cv.getContext("2d").drawImage(img,0,0,w,h);
      resolve(cv.toDataURL("image/jpeg",0.5));
    }; img.src=e.target.result; };
    reader.readAsDataURL(file);
  });
}

// ---------- RENDER ----------
function render(){
  const app=document.getElementById("app");
  app.innerHTML = `
    ${topbar()}
    ${tabs()}
    <div id="tabcontent"></div>
    <div class="footer-note">Bitácora CCP — Planta Tipo II (Pisos 15 y 16), Cámara de Comercio de Pereira · ${CAPITULOS_BORRADOR_NOTE}</div>
  `;
  document.getElementById("tabcontent").innerHTML =
    state.tab==="captura" ? renderCaptura() :
    state.tab==="sabana" ? renderSabana() :
    state.tab==="memoria" ? renderMemoria() : renderFicha();
  wireEvents();
}

function topbar(){
  return `<div class="topbar">
    <div class="brand">
      <div class="mark">CCP</div>
      <div><h1>Bitácora de diagnóstico</h1><div class="sub">Planta Tipo II — Pisos 15 y 16 · Cámara de Comercio de Pereira</div></div>
    </div>
    <div class="tecnico-field">Técnico: <input id="tecnicoInput" type="text" placeholder="Nombre" value="${esc(state.tecnico)}"></div>
  </div>`;
}
function tabs(){
  const t=[["captura","Captura"],["sabana","Sábana"],["memoria","Memoria de cantidades"],["ficha","Ficha por oficina"]];
  return `<div class="tabs">${t.map(([k,l])=>`<button class="tab ${state.tab===k?'active':''}" data-tab="${k}">${l}</button>`).join("")}</div>`;
}

function selectorPisoOficina(){
  return `<div class="card"><div class="row">
    <div class="field" style="max-width:140px"><label>Piso real</label>
      <select id="selPiso"><option value="15" ${state.piso==="15"?"selected":""}>Piso 15</option><option value="16" ${state.piso==="16"?"selected":""}>Piso 16</option></select>
    </div>
    <div class="field"><label>Oficina / Zona</label>
      <select id="selOficina">${OFICINAS_ORDEN.map(o=>`<option value="${o}" ${state.oficina===o?"selected":""}>${esc(ofLabel(o))}</option>`).join("")}</select>
    </div>
  </div></div>`;
}

function tipoLabel(t){
  return {Muro:"Muros","Ventana":"Ventanas","Antepecho+Ventana":"Antepecho + Ventana","MuroVentanaBaño":"Muro ventana (baño)",
    Rejilla:"Rejillas de fachada", Buitron:"Buitrones", "Mesón":"Mesones de cocineta", Jardinera:"Jardineras",
    Columna:"Columnas", Piso:"Piso", CieloRaso:"Cielo raso"}[t]||t;
}

function estadoBadge(h){
  if(!h) return `<span class="badge pend">Sin capturar</span>`;
  if(h.estado==="Afectado") return `<span class="badge bad">Afectado</span>`;
  if(h.estado==="Bien") return `<span class="badge ok">Bien</span>`;
  return `<span class="badge pend">${esc(h.estado||"")}</span>`;
}

function renderCaptura(){
  if(state.oficina==="PUNTO FIJO"){
    var pfNote = `<div class="card"><div class="alert">Punto Fijo (M72, M74, M75, M76): pendiente de levantamiento — altura de muros y ventanas por definir. No se captura diagnóstico aquí hasta la visita de campo específica.</div></div>`;
  } else pfNote="";
  const els = elementosDe(state.oficina);
  const grupos = {};
  els.forEach(e=>{ (grupos[e.tipo]=grupos[e.tipo]||[]).push(e); });
  const orden = ["Muro","Ventana","Antepecho+Ventana","MuroVentanaBaño","Piso","CieloRaso","Buitron","Mesón","Jardinera","Rejilla","Columna"];
  let html = selectorPisoOficina() + pfNote + `<div class="card"><div style="font-size:12px;color:var(--text-dim);margin-bottom:4px">Espacio: <b style="color:var(--text)">${esc(codigoEspacio())}</b></div>`;
  orden.filter(t=>grupos[t]).forEach(t=>{
    html += `<div class="grupo-title">${tipoLabel(t)} (${grupos[t].length})</div>`;
    grupos[t].forEach(el=>{
      const h = hallazgoDe(el.id);
      const isSec = el.secundaria===state.oficina;
      html += `<div class="elemento">
        <span class="id">${el.id}</span>
        <span class="desc">${el.punto_fijo?'<span class="badge pend">Pendiente</span>':''} ${isSec?'<span class="sec">(comparte con '+esc(el.oficina)+')</span>':''} ${h&&h.codigo_origen?'<span class="origen-badge">auto — origen '+esc(h.codigo_origen)+'</span>':''}</span>
        ${estadoBadge(h)}
        <button class="btn small" data-open="${el.id}" ${el.punto_fijo?'disabled':''}>${h?'Editar':'Capturar'}</button>
      </div>`;
      if(state.openEl===el.id){ html += formularioElemento(el,h); }
    });
  });
  html += `</div>`;
  return html;
}

function fotosField(h){
  const fotos = (h&&h.fotos)||[];
  return `<div><label style="font-size:11px;font-weight:600;color:var(--text-dim);text-transform:uppercase">Fotos (máx. 3)</label>
    <input type="file" accept="image/*" capture="environment" multiple id="fotoInput_${(h&&h.codigo_elemento)||'new'}">
    <div class="thumbs" id="fotoThumbs">${fotos.map(f=>`<img src="${f}">`).join("")}</div>
  </div>`;
}

function formularioElemento(el,h){
  h = h || { codigo_elemento: el.id, codigo_espacio: codigoEspacio(), tipo_elemento: el.tipo, oficina: state.oficina, piso_real: state.piso, estado:"Bien", fotos:[] };
  let body="";
  if(el.tipo==="Muro"){
    const sevKey = h.severidad_key || "bien";
    const regla = MURO_REGLAS[sevKey];
    body = `
      <div class="row">
        <div class="field"><label>Estado / Severidad</label>
          <select id="f_severidad">
            ${Object.entries(MURO_REGLAS).map(([k,r])=>`<option value="${k}" ${sevKey===k?"selected":""}>${esc(r.label)}</option>`).join("")}
          </select>
        </div>
      </div>
      <div id="reglaBox">${regla.intervencion?`<div class="rule-box"><b>Intervención sugerida:</b> ${esc(regla.intervencion)}<br><b>Capítulo:</b> ${esc(regla.capitulo)}<br><b>Unidad:</b> ${esc(regla.unidad)} · <b>Tipo de cantidad:</b> ${esc(regla.tipo_cantidad)}</div>`:""}</div>
      <div class="row" id="cantidadRow">
        ${sevKey!=="bien" ? `<div class="field"><label>Cantidad (m²)</label><input type="number" step="0.01" id="f_cantidad" value="${h.cantidad!=null?h.cantidad:''}" placeholder="Longitud × altura"></div>`:""}
      </div>
      ${sevKey==="fisura_mayor" ? `<div class="row">
        <div class="field"><label>Espesor medido (mm)</label><input type="number" step="0.1" id="f_espesor" value="${h.espesor_mm!=null?h.espesor_mm:''}"></div>
        <div class="field"><label>Longitud grapado (ml)</label><input type="number" step="0.1" id="f_ml_grapado" value="${h.ml_grapado!=null?h.ml_grapado:''}"></div>
      </div><div class="note">Umbral de referencia: ${UMBRAL_FISURA_MM} mm (ajustable según tu criterio en obra).</div>` : ""}
      ${sevKey==="grieta_grave" ? `<div class="alert">Al guardar se generará automáticamente un hallazgo de <b>Piso</b> en esta oficina (demolición y reposición), y queda pendiente revisar en terreno interruptores, salidas y tomas embebidos en este muro.</div>`:""}
    `;
  } else if(el.tipo==="Ventana"||el.tipo==="Antepecho+Ventana"||el.tipo==="MuroVentanaBaño"){
    body = `<div class="rule-box"><b>Regla fija:</b> reposición total por ventana nueva, sin importar el estado encontrado.</div>
      <div class="row">
        <div class="field"><label>Estado encontrado (referencia)</label>
          <select id="f_estado"><option value="Bien" ${h.estado==="Bien"?"selected":""}>Bien</option><option value="Afectado" ${h.estado==="Afectado"?"selected":""}>Afectado</option></select>
        </div>
        <div class="field"><label>Cantidad (und)</label><input type="number" id="f_cantidad" value="${h.cantidad!=null?h.cantidad:1}"></div>
      </div>`;
  } else if(el.tipo==="Piso"){
    body = `<div class="row">
        <div class="field"><label>Material actual</label>
          <select id="f_material">${PISO_MATERIALES.map(m=>`<option ${h.material===m?"selected":""}>${m}</option>`).join("")}</select>
        </div>
        <div class="field"><label>Estado</label>
          <select id="f_estado"><option value="Bien" ${h.estado==="Bien"?"selected":""}>Bien</option><option value="Afectado" ${h.estado==="Afectado"?"selected":""}>Afectado</option></select>
        </div>
        <div class="field"><label>Cantidad base (m²)</label><input type="number" step="0.01" id="f_cantidad" value="${h.cantidad!=null?h.cantidad:el.area_base_m2}"></div>
      </div>
      ${h.codigo_origen?`<div class="alert">Generado automáticamente por demolición del muro ${esc(h.codigo_origen)}.</div>`:""}
      <div class="field"><label>Patología (si afectado)</label>
        <select id="f_patologia"><option>Desgaste</option><option>Fisuras</option><option>Manchas</option><option>Demolición por muro asociado</option><option>Otro</option></select>
      </div>`;
  } else if(el.tipo==="CieloRaso"){
    const tipoFijo = CIELO_RASO_TIPO[state.piso];
    body = `<div class="rule-box"><b>Sistema (según piso ${state.piso}):</b> ${esc(tipoFijo)}</div>
      <div class="row">
        <div class="field"><label>Estado</label>
          <select id="f_estado"><option value="Bien" ${h.estado==="Bien"?"selected":""}>Bien</option><option value="Afectado" ${h.estado==="Afectado"?"selected":""}>Afectado (muy afectado)</option></select>
        </div>
        <div class="field"><label>Cantidad base (m²)</label><input type="number" step="0.01" id="f_cantidad" value="${h.cantidad!=null?h.cantidad:el.area_base_m2}"></div>
      </div>
      <div class="note">Si Afectado → intervención: ${esc(CIELO_RASO_INTERVENCION[state.piso])}</div>`;
  } else if(el.tipo==="Buitron"){
    body = `<div class="rule-box"><b>Regla fija:</b> interior del buitrón sin intervención (queda cerrado). La cara hacia la oficina (muro MV) se interviene según la patología encontrada en ese muro.</div>
      <div class="field"><label>Observaciones de campo</label><textarea id="f_obs">${esc(h.observaciones||"")}</textarea></div>`;
  } else if(el.tipo==="Mesón"){
    body = `<div class="rule-box"><b>Regla fija:</b> reposición total del mesón (profundidad 0.6 m, longitud variable a medir).</div>
      <div class="row">
        <div class="field"><label>Material nuevo</label><select id="f_material">${ENCHAPE_MATERIALES.map(m=>`<option ${h.material===m?"selected":""}>${m}</option>`).join("")}</select></div>
        <div class="field"><label>Longitud (m)</label><input type="number" step="0.01" id="f_cantidad" value="${h.cantidad!=null?h.cantidad:''}"></div>
      </div>`;
  } else {
    body = `<div class="field"><label>Estado</label>
        <select id="f_estado"><option value="Bien" ${h.estado==="Bien"?"selected":""}>Bien</option><option value="Afectado" ${h.estado==="Afectado"?"selected":""}>Afectado</option></select>
      </div>
      <div class="field"><label>Observaciones</label><textarea id="f_obs">${esc(h.observaciones||"")}</textarea></div>`;
  }
  return `<div class="panel" id="panel_${el.id}">
    ${body}
    ${fotosField(h)}
    <div class="row" style="margin-top:10px">
      <button class="btn primary" data-guardar="${el.id}">Guardar</button>
      <button class="btn" data-cerrar="1">Cancelar</button>
    </div>
  </div>`;
}

function renderSabana(){
  const rows = hallazgos.slice().sort((a,b)=>(a.codigo_espacio||"").localeCompare(b.codigo_espacio||"")||(a.codigo_elemento||"").localeCompare(b.codigo_elemento||""));
  return `<div class="card">
    <div class="row" style="margin-bottom:10px">
      <button class="btn" id="btnExportSabana">Exportar CSV — Sábana completa</button>
      <span style="font-size:12px;color:var(--text-dim);align-self:center">${rows.length} registros</span>
    </div>
    <div class="tablewrap"><table><thead><tr>
      <th>Espacio</th><th>Elemento</th><th>Tipo</th><th>Estado</th><th>Detalle</th><th>Capítulo</th><th>Cantidad</th><th>Origen</th><th>Técnico</th><th>Fotos</th>
    </tr></thead><tbody>
    ${rows.length? rows.map(h=>`<tr>
      <td>${esc(h.codigo_espacio)}</td><td><b>${esc(h.codigo_elemento)}</b></td><td>${esc(tipoLabel(h.tipo_elemento))}</td>
      <td>${estadoBadge(h)}</td>
      <td>${esc(h.severidad_label||h.patologia||h.material||"")}</td>
      <td style="max-width:220px">${esc(h.capitulo||"")}</td>
      <td>${h.cantidad!=null?fmt(h.cantidad)+" "+esc(h.unidad||""):""}</td>
      <td>${h.codigo_origen?esc(h.codigo_origen):"—"}</td>
      <td>${esc(h.tecnico||"")}</td>
      <td>${(h.fotos&&h.fotos.length)||0}</td>
    </tr>`).join("") : `<tr><td colspan="10" class="empty">Aún no hay hallazgos capturados.</td></tr>`}
    </tbody></table></div>
  </div>`;
}

function renderMemoria(){
  const afectados = hallazgos.filter(h=>h.estado==="Afectado" && h.capitulo);
  const grupos={};
  afectados.forEach(h=>{
    const key=h.capitulo+"|"+(h.unidad||"");
    grupos[key]=grupos[key]||{capitulo:h.capitulo,unidad:h.unidad,cantidad:0,n:0};
    grupos[key].cantidad += (parseFloat(h.cantidad)||0);
    grupos[key].n += 1;
  });
  const lista = Object.values(grupos).sort((a,b)=>a.capitulo.localeCompare(b.capitulo));
  return `<div class="card">
    <div class="row" style="margin-bottom:10px">
      <button class="btn" id="btnExportMemoria">Exportar CSV — Memoria de cantidades</button>
      <span style="font-size:12px;color:var(--text-dim);align-self:center">${lista.length} ítems agregados</span>
    </div>
    <div class="tablewrap"><table><thead><tr><th>Ítem / Capítulo</th><th>Unidad</th><th>Cantidad</th><th># hallazgos</th></tr></thead><tbody>
    ${lista.length? lista.map(g=>`<tr><td>${esc(g.capitulo)}</td><td>${esc(g.unidad)}</td><td><b>${fmt(g.cantidad)}</b></td><td>${g.n}</td></tr>`).join("") : `<tr><td colspan="4" class="empty">Ningún hallazgo "Afectado" capturado todavía.</td></tr>`}
    </tbody></table></div>
    <div class="note" style="margin-top:8px">El valor unitario (APU) se aplica aparte, en CESOFT, sobre estas cantidades — esta memoria se detiene en Cantidad, tal como define la metodología del proyecto.</div>
  </div>`;
}

function renderFicha(){
  const h1 = `<div class="card"><div class="row">
    <div class="field" style="max-width:140px"><label>Piso real</label>
      <select id="selPisoF"><option value="15" ${state.piso==="15"?"selected":""}>Piso 15</option><option value="16" ${state.piso==="16"?"selected":""}>Piso 16</option></select>
    </div>
    <div class="field"><label>Oficina</label>
      <select id="selOficinaF">${OFICINAS_ORDEN.map(o=>`<option value="${o}" ${state.oficina===o?"selected":""}>${esc(ofLabel(o))}</option>`).join("")}</select>
    </div>
  </div></div>`;
  const cod = codigoEspacio();
  const hs = hallazgos.filter(h=>h.codigo_espacio===cod);
  const afectados = hs.filter(h=>h.estado==="Afectado");
  const stat = `<div class="statline">
    <div class="stat"><div class="n">${elementosDe(state.oficina).length}</div><div class="l">Elementos en catálogo</div></div>
    <div class="stat"><div class="n">${hs.length}</div><div class="l">Capturados</div></div>
    <div class="stat"><div class="n">${afectados.length}</div><div class="l">Afectados</div></div>
  </div>`;
  const fotos = hs.flatMap(h=>(h.fotos||[]).map(f=>({f,el:h.codigo_elemento})));
  return `${h1}<div class="card">
    <h3 style="margin:0 0 4px">Ficha técnica — ${esc(cod)}</h3>
    <div style="font-size:12px;color:var(--text-dim);margin-bottom:10px">Cámara de Comercio de Pereira · Planta Tipo II</div>
    ${stat}
    <div class="grupo-title">Hallazgos "Afectado"</div>
    <div class="tablewrap"><table><thead><tr><th>Elemento</th><th>Detalle</th><th>Cantidad</th><th>Capítulo</th></tr></thead><tbody>
    ${afectados.length? afectados.map(h=>`<tr><td><b>${esc(h.codigo_elemento)}</b></td><td>${esc(h.severidad_label||h.patologia||h.material||"")}</td><td>${h.cantidad!=null?fmt(h.cantidad)+" "+esc(h.unidad||""):""}</td><td>${esc(h.capitulo||"")}</td></tr>`).join(""):`<tr><td colspan="4" class="empty">Sin hallazgos afectados en esta oficina.</td></tr>`}
    </tbody></table></div>
    <div class="grupo-title">Registro fotográfico</div>
    <div class="thumbs">${fotos.length?fotos.map(x=>`<img src="${x.f}" title="${esc(x.el)}">`).join(""):'<div class="empty">Sin fotos</div>'}</div>
  </div>`;
}

// ---------- EVENTS ----------
function wireEvents(){
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{ state.tab=b.dataset.tab; state.openEl=null; render(); });
  const tecInput=document.getElementById("tecnicoInput");
  if(tecInput) tecInput.onchange=e=>{ state.tecnico=e.target.value; try{localStorage.setItem("ccp_tecnico",state.tecnico);}catch(err){} };

  const selPiso=document.getElementById("selPiso"); if(selPiso) selPiso.onchange=e=>{ state.piso=e.target.value; state.openEl=null; render(); };
  const selOficina=document.getElementById("selOficina"); if(selOficina) selOficina.onchange=e=>{ state.oficina=e.target.value; state.openEl=null; render(); };
  const selPisoF=document.getElementById("selPisoF"); if(selPisoF) selPisoF.onchange=e=>{ state.piso=e.target.value; render(); };
  const selOficinaF=document.getElementById("selOficinaF"); if(selOficinaF) selOficinaF.onchange=e=>{ state.oficina=e.target.value; render(); };

  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{ state.openEl = (state.openEl===b.dataset.open)?null:b.dataset.open; render(); });
  document.querySelectorAll("[data-cerrar]").forEach(b=>b.onclick=()=>{ state.openEl=null; render(); });

  const fSev=document.getElementById("f_severidad");
  if(fSev) fSev.onchange=()=>{
    // re-render just the panel with new severity preview by simulating stored value
    const el=CATALOGO.find(e=>e.id===state.openEl);
    const h=hallazgoDe(state.openEl)||{};
    h.severidad_key=fSev.value;
    document.getElementById("panel_"+state.openEl).outerHTML = formularioElemento(el,h);
    wirePanelOnly();
  };

  document.querySelectorAll("[data-guardar]").forEach(b=>b.onclick=()=>onGuardar(b.dataset.guardar));

  const btnEs=document.getElementById("btnExportSabana"); if(btnEs) btnEs.onclick=()=>exportCSV("sabana");
  const btnEm=document.getElementById("btnExportMemoria"); if(btnEm) btnEm.onclick=()=>exportCSV("memoria");
}
function wirePanelOnly(){
  const fSev=document.getElementById("f_severidad");
  if(fSev) fSev.onchange=()=>{
    const el=CATALOGO.find(e=>e.id===state.openEl);
    const h=hallazgoDe(state.openEl)||{};
    h.severidad_key=fSev.value;
    document.getElementById("panel_"+state.openEl).outerHTML = formularioElemento(el,h);
    wirePanelOnly();
  };
  document.querySelectorAll("[data-guardar]").forEach(b=>b.onclick=()=>onGuardar(b.dataset.guardar));
  document.querySelectorAll("[data-cerrar]").forEach(b=>b.onclick=()=>{ state.openEl=null; render(); });
}

async function onGuardar(elId){
  const el = CATALOGO.find(e=>e.id===elId);
  const existing = hallazgoDe(elId) || {};
  let doc = { codigo_elemento: elId, codigo_espacio: codigoEspacio(), tipo_elemento: el.tipo,
    oficina: state.oficina, piso_real: state.piso, tecnico: state.tecnico, fecha: new Date().toISOString(),
    fotos: existing.fotos||[] };
  if(existing.codigo_origen) doc.codigo_origen = existing.codigo_origen;

  const val = id => { const n=document.getElementById(id); return n?n.value:undefined; };

  if(el.tipo==="Muro"){
    const sevKey = val("f_severidad")||"bien";
    const regla = MURO_REGLAS[sevKey];
    doc.severidad_key = sevKey; doc.severidad_label = regla.label;
    doc.estado = sevKey==="bien" ? "Bien" : "Afectado";
    doc.intervencion = regla.intervencion; doc.capitulo = regla.capitulo; doc.unidad = regla.unidad; doc.tipo_cantidad = regla.tipo_cantidad;
    doc.cantidad = parseFloat(val("f_cantidad"))||null;
    if(sevKey==="fisura_mayor"){ doc.espesor_mm = parseFloat(val("f_espesor"))||null; doc.ml_grapado = parseFloat(val("f_ml_grapado"))||null; }
  } else if(el.tipo==="Ventana"||el.tipo==="Antepecho+Ventana"||el.tipo==="MuroVentanaBaño"){
    doc.estado = val("f_estado")||"Bien";
    doc.capitulo = "1.7 Carpintería — Reposición de ventanas (regla fija: reposición total)";
    doc.unidad = "und"; doc.cantidad = parseFloat(val("f_cantidad"))||1;
    doc.severidad_label = "Reposición total (regla fija)";
  } else if(el.tipo==="Piso"){
    doc.material = val("f_material"); doc.estado = val("f_estado")||"Bien";
    doc.cantidad = parseFloat(val("f_cantidad")); doc.unidad="m²";
    doc.patologia = val("f_patologia");
    doc.capitulo = "1.4 Pisos — Demolición y reposición";
  } else if(el.tipo==="CieloRaso"){
    doc.estado = val("f_estado")||"Bien"; doc.cantidad = parseFloat(val("f_cantidad")); doc.unidad="m²";
    doc.tipo_sistema = CIELO_RASO_TIPO[state.piso];
    doc.intervencion = doc.estado==="Afectado" ? CIELO_RASO_INTERVENCION[state.piso] : "";
    doc.capitulo = state.piso==="15" ? "1.5 Cielo raso — Pañete, estuco y pintura" : "1.6 Cielo raso — Drywall";
  } else if(el.tipo==="Buitron"){
    doc.estado="Informativo"; doc.observaciones = val("f_obs");
  } else if(el.tipo==="Mesón"){
    doc.material = val("f_material"); doc.estado="Afectado";
    doc.cantidad = parseFloat(val("f_cantidad")); doc.unidad="m";
    doc.capitulo = "1.8 Cocinetas y baños — Mesón, enchapes y mueble (reposición total)";
    doc.severidad_label = "Reposición total (regla fija)";
  } else {
    doc.estado = val("f_estado")||"Bien"; doc.observaciones = val("f_obs");
  }

  const fotoInput = document.getElementById("fotoInput_"+elId) || document.getElementById("fotoInput_new");
  if(fotoInput && fotoInput.files && fotoInput.files.length){
    const files = Array.from(fotoInput.files).slice(0,3);
    const nuevas = await Promise.all(files.map(f=>resizeImage(f,640)));
    doc.fotos = nuevas;
  }

  const ok = await guardarHallazgo(doc, elId+"__"+codigoEspacio());
  if(!ok) return;

  // Cascada: muro con grieta grave -> genera hallazgo de piso
  if(el.tipo==="Muro" && doc.severidad_key==="grieta_grave"){
    const pisoEl = CATALOGO.find(e=>e.tipo==="Piso" && e.oficina===state.oficina);
    if(pisoEl){
      const pisoDoc = {
        codigo_elemento: pisoEl.id, codigo_espacio: codigoEspacio(), tipo_elemento:"Piso",
        oficina: state.oficina, piso_real: state.piso, tecnico: state.tecnico, fecha: new Date().toISOString(),
        estado:"Afectado", material: (hallazgoDe(pisoEl.id)||{}).material || "Por definir",
        cantidad: pisoEl.area_base_m2, unidad:"m²",
        patologia: "Demolición por muro asociado",
        capitulo: "1.4 Pisos — Demolición y reposición",
        codigo_origen: elId, fotos: (hallazgoDe(pisoEl.id)||{}).fotos||[]
      };
      await guardarHallazgo(pisoDoc, pisoEl.id+"__"+codigoEspacio());
      toast("Guardado. Se generó automáticamente el hallazgo de Piso por demolición del muro "+elId+".");
    } else { toast("Guardado."); }
  } else {
    toast("Guardado.");
  }
  state.openEl=null;
}

function csvEscape(v){ v = v==null?"":String(v); if(/[",\n]/.test(v)) v='"'+v.replace(/"/g,'""')+'"'; return v; }
async function exportCSV(kind){
  let rows, filename;
  if(kind==="sabana"){
    const cols=["codigo_espacio","codigo_elemento","tipo_elemento","estado","severidad_label","material","patologia","intervencion","capitulo","tipo_cantidad","cantidad","unidad","codigo_origen","tecnico","fecha","observaciones"];
    rows=[cols].concat(hallazgos.map(h=>cols.map(c=>h[c])));
    filename="sabana_bitacora_ccp.csv";
  } else {
    const afectados = hallazgos.filter(h=>h.estado==="Afectado" && h.capitulo);
    const grupos={};
    afectados.forEach(h=>{ const key=h.capitulo+"|"+(h.unidad||""); grupos[key]=grupos[key]||{capitulo:h.capitulo,unidad:h.unidad,cantidad:0}; grupos[key].cantidad+=(parseFloat(h.cantidad)||0); });
    const cols=["Item/Capitulo","Unidad","Cantidad"];
    rows=[cols].concat(Object.values(grupos).map(g=>[g.capitulo,g.unidad,fmt(g.cantidad)]));
    filename="memoria_cantidades_ccp.csv";
  }
  const csv = rows.map(r=>r.map(csvEscape).join(",")).join("\n");
  if(downloads){
    try{ await downloads.save({filename, data: csv}); toast("Archivo descargado."); }
    catch(e){ toast("No se pudo exportar: "+(e&&e.code||"error")); }
  } else { toast("Exportación no disponible en esta vista."); }
}

render();
initDb();
</script>
